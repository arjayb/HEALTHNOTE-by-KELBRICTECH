name: Flutter Android proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-android.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/flutter-android.yml'

jobs:
  prove:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Generate clean Android scaffold
        run: |
          rm -rf android
          flutter create --platforms=android --org com.kelbrictech --project-name healthnote .
      - name: Remove generated template test
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - name: Apply Android privacy policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          text = text.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />',
          )
          text = text.replace(
              '    <application\n',
              '    <application\n'
              '        android:allowBackup="false"\n'
              '        android:fullBackupContent="false"\n',
              1,
          )
          path.write_text(text)
          PY
      - name: Privacy manifest gate
        run: |
          ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Align legacy OCR plugin compile SDK
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pub_cache = Path(os.environ['PUB_CACHE'])
          files = list(pub_cache.glob('hosted/pub.dev/google_mlkit_*/android/build.gradle'))
          if not files:
              raise SystemExit('No Google ML Kit Android Gradle files found')

          for path in files:
              text = path.read_text()
              updated = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
              updated = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', updated)
              if updated != text:
                  path.write_text(updated)
                  print(f'Aligned {path.name} under {path.parent.parent.name}')
          PY
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: healthnote-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
